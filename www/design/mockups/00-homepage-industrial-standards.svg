  <text class="mono ink" x="384" y="822" font-size="12" font-weight="900">02 UI</text>
  <text
    class="sans ink"
    x="384"
    y="852"
    font-size="24"
    font-weight="850"
  >Open Props primitives</text>
  <text class="mono ink" x="744" y="822" font-size="12" font-weight="900">03 FRAMEWORK</text>
  <text
    class="sans ink"
    x="744"
    y="852"
    font-size="24"
    font-weight="850"
