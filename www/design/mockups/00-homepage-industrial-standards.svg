      fill-rule="evenodd"
    />
    <path d="M75 2 H98 V25" fill="none" stroke="#fa5252" stroke-width="12" />
    <path d="M34 41 H62 M34 55 H62" fill="none" stroke="#fa5252" stroke-width="6" />
  </g>
  <text class="sans ink" x="92" y="43" font-size="22" font-weight="900">openElement</text>
  <text class="mono ink" x="94" y="61" font-size="10" font-weight="800">WEB STANDARDS LAB</text>
  <text class="sans ink" x="658" y="42" font-size="14" font-weight="800">Docs</text>
  <text class="sans ink" x="732" y="42" font-size="14" font-weight="800">Architecture</text>
  <text class="sans ink" x="875" y="42" font-size="14" font-weight="800">Design System</text>
  <rect x="1208" y="12" width="212" height="40" fill="#0c0b11" />
  <text class="sans paper" x="1230" y="37" font-size="14" font-weight="900">Start building</text>
  <text
    class="sans paper"
    x="1394"
    y="37"
    font-size="20"
    font-weight="900"
    text-anchor="middle"
  >→</text>

