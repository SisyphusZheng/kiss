    <path
      d="M48 0 C76 0 96 20 96 48 C96 76 76 96 48 96 C20 96 0 76 0 48 C0 20 20 0 48 0 Z M48 22 C32 22 22 32 22 48 C22 64 32 74 48 74 C64 74 74 64 74 48 C74 32 64 22 48 22 Z"
