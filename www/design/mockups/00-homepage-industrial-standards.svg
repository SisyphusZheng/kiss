  <text
    class="sans ink"
    x="20"
    y="482"
    font-size="30"
    font-weight="650"
  >as one inspectable application system.</text>

  <text class="mono ink" x="494" y="100" font-size="12" font-weight="900">SYSTEM</text>
  <text class="mono ink" x="730" y="100" font-size="12" font-weight="900">v0.40.7</text>

  <g transform="translate(968 160)" class="ink">
    <path
      d="M188 0 C298 0 376 78 376 188 C376 298 298 376 188 376 C78 376 0 298 0 188 C0 78 78 0 188 0 Z M188 84 C124 84 84 124 84 188 C84 252 124 292 188 292 C252 292 292 252 292 188 C292 124 252 84 188 84 Z"
