<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" role="img">
  <title>openElement Monet Protocol Lab homepage mockup</title>
  <desc>Monet purple full-width homepage concept with open O aperture, soft protocol grid, and refined product sections.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1440" y2="920" gradientUnits="userSpaceOnUse">
