      fill-rule="evenodd"
    />
    <path d="M294 8 H386 V100" fill="none" stroke="#fa5252" stroke-width="46" />
    <path d="M132 160 H244 M132 216 H244" fill="none" stroke="#fa5252" stroke-width="28" />
