<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" role="img">
  <title>openElement homepage concept - Industrial Standards System</title>
  <desc>Enerblock-inspired art direction translated to openElement.</desc>
  <defs>
    <style>.sans { font-family: Inter, Arial, Helvetica, sans-serif; }
      .mono { font-family: "SF Mono", Consolas, monospace; }
      .ink { fill: #0c0b11; }
      .paper { fill: #f8f9fa; }
      .muted { fill: #343a40; }
      .red { fill: #fa5252; }
      .line { stroke: rgba(12,11,17,0.28); stroke-width: 1; }
      .whiteLine { stroke: rgba(248,249,250,0.18); stroke-width: 1; }</style>
  </defs>
  <rect width="1440" height="920" fill="#fa5252" />
  <path
    d="M0 64 H1440 M0 184 H1440 M0 500 H1440 M0 620 H1440 M472 0 V620 M730 64 V620 M1012 64 V620 M1386 64 V620"
    class="line"
