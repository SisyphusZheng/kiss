  <text class="mono paper" x="1034" y="646" font-size="18">@openelement/ui</text>
  <text class="mono paper" x="1034" y="684" font-size="18">@openelement/app</text>

  <rect x="0" y="780" width="1440" height="140" fill="#f8f9fa" />
  <path d="M0 780 H1440 M0 860 H1440 M360 780 V920 M720 780 V920 M1080 780 V920" class="line" />
  <text class="mono ink" x="24" y="822" font-size="12" font-weight="900">01 ELEMENTS</text>
  <text
    class="sans ink"
    x="24"
    y="852"
    font-size="24"
    font-weight="850"
