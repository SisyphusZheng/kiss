<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1760" viewBox="0 0 1440 1760">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <linearGradient id="dsFlood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8262db" />
      <stop offset="100%" stop-color="#6d4cc4" />
    </linearGradient>
  </defs>
  <rect width="1440" height="1760" fill="#0a0714" />

  <line x1="72" y1="96" x2="104" y2="96" stroke="#8262db" stroke-width="2" />
  <text x="116" y="101" class="mono" font-size="12" font-weight="500" fill="#b59cff"
    letter-spacing="3.5">OPENELEMENT — DESIGN LANGUAGE V3 · VIEW-SOURCE EDITORIAL</text>
  <text x="64" y="190" class="mono" font-size="52" font-weight="800" fill="#f3eaff"
    letter-spacing="-2.5">The site wears its</text>
  <text x="64" y="252" class="serif" font-size="62" font-style="italic"
    fill="#b59cff">standards on its sleeve.</text>
  <text x="72" y="300" class="mono" font-size="13"
    fill="#adb5bd">Spec-sheet taxonomy meets editorial typography. Type is the visual; decoration is annotation.</text>

  <!-- 01 kinetic type -->
  <text x="72" y="390" class="mono" font-size="12" font-weight="700" fill="#8262db"
    letter-spacing="3">01 / KINETIC TYPE — TWO VOICES AT FULL VOLUME</text>
  <line x1="0" y1="414.5" x2="1440" y2="414.5" stroke="#ffffff" stroke-opacity="0.08" />
  <text x="64" y="520" class="mono" font-size="84" font-weight="800" fill="#f3eaff"
    letter-spacing="-4">MONO CAPS 800</text>
  <text x="64" y="616" class="serif" font-size="96" font-style="italic"
    fill="#b59cff">serif italic, oversized.</text>
  <g class="mono" font-size="11.5" fill="#868e96">
    <text x="72"
      y="672">STRUCTURE — JetBrains Mono 800 caps, −0.05em, 84–150px, hugs the left margin (x=64) and may crop edges.</text>
    <text x="72"
      y="698">MOMENT — Instrument Serif italic, 0.9–1.4× the mono size, violet, offset right. One accent per composition.</text>
    <text x="72"
      y="724">EVERYTHING ELSE — Mono 400/500/700 at 11–17px. No third family. Body stays mono: the constraint is the brand.</text>
  </g>
  <g>
    <rect x="960" y="450" width="408" height="270" rx="12" fill="#100a1c" stroke="#ffffff"
      stroke-opacity="0.09" />
    <line x1="960" y1="451" x2="1368" y2="451" stroke="#b59cff" stroke-opacity="0.55" />
    <text x="988" y="486" class="mono" font-size="11" font-weight="700" fill="#868e96"
      letter-spacing="1.5">DO / DON'T</text>
    <text x="988" y="524" class="mono" font-size="12" fill="#4ade80">✓ THE WEB, composed.</text>
    <text x="988" y="552" class="mono" font-size="12" fill="#4ade80">✓ Forward, VERSIONED.</text>
    <text x="988" y="580" class="mono" font-size="12" fill="#f87171">✗ centered headlines</text>
    <text x="988" y="608" class="mono" font-size="12"
      fill="#f87171">✗ two serif accents, one headline</text>
    <text x="988" y="636" class="mono" font-size="12"
      fill="#f87171">✗ cards in a neat row of three</text>
    <text x="988" y="664" class="mono" font-size="12" fill="#f87171">✗ decorative mascots</text>
  </g>

  <!-- 02 devices -->
  <text x="72" y="810" class="mono" font-size="12" font-weight="700" fill="#8262db"
    letter-spacing="3">02 / COMPOSITION DEVICES</text>
  <line x1="0" y1="834.5" x2="1440" y2="834.5" stroke="#ffffff" stroke-opacity="0.08" />
  <g>
    <text x="72" y="940" class="mono" font-size="90" font-weight="800" fill="none" stroke="#58399e"
      stroke-width="1.5">01</text>
    <text x="250" y="918" class="mono" font-size="13" font-weight="800"
      fill="#f3eaff">OUTLINED INDEX NUMERALS</text>
    <text x="250" y="946" class="mono" font-size="11.5"
      fill="#adb5bd">56–260px, 1.2–1.5px stroke, violet-4. They anchor sections;</text>
    <text x="250" y="970" class="mono" font-size="11.5"
      fill="#adb5bd">cropping at the canvas edge is allowed and encouraged.</text>
  </g>
  <g>
    <rect x="760" y="862" width="300" height="120" fill="url(#dsFlood)" rx="8" />
    <text x="784" y="914" class="mono" font-size="15" font-weight="800"
      fill="#130a22">FLOOD INVERSION</text>
    <text x="784" y="944" class="mono" font-size="11"
      fill="#2f1c52">one full-bleed violet scene per page,</text>
    <text x="784" y="966" class="mono" font-size="11"
      fill="#2f1c52">ink text, never two in a row</text>
    <rect x="1090" y="862" width="278" height="120" fill="#0d0918" stroke="#ffffff"
      stroke-opacity="0.08" rx="8" />
    <text x="1106" y="902" class="mono" font-size="12" font-weight="500" fill="#8262db"
      letter-spacing="1.5">CUSTOM ELEMENTS ✳ DSD ✳</text>
    <text x="1106" y="934" class="mono" font-size="11" fill="#adb5bd">STANDARDS MARQUEE</text>
    <text x="1106" y="958" class="mono" font-size="11"
      fill="#adb5bd">the spine between scenes</text>
  </g>

  <!-- 03 color -->
  <text x="72" y="1090" class="mono" font-size="12" font-weight="700" fill="#8262db"
    letter-spacing="3">03 / VIOLET ON INK</text>
  <line x1="0" y1="1114.5" x2="1440" y2="1114.5" stroke="#ffffff" stroke-opacity="0.08" />
  <g>
    <rect x="72" y="1144" width="100" height="72" rx="8" fill="#0a0714" stroke="#ffffff"
      stroke-opacity="0.12" />
    <rect x="182" y="1144" width="100" height="72" rx="8" fill="#130a22" />
    <rect x="292" y="1144" width="100" height="72" rx="8" fill="#21143b" />
    <rect x="402" y="1144" width="100" height="72" rx="8" fill="#2f1c52" />
    <rect x="512" y="1144" width="100" height="72" rx="8" fill="#58399e" />
    <rect x="622" y="1144" width="100" height="72" rx="8" fill="#8262db" />
    <rect x="732" y="1144" width="100" height="72" rx="8" fill="#b59cff" />
    <rect x="842" y="1144" width="100" height="72" rx="8" fill="#e6d8ff" />
    <text x="72" y="1240" class="mono" font-size="10" fill="#868e96">canvas</text>
    <text x="182" y="1240" class="mono" font-size="10" fill="#868e96">surface</text>
    <text x="292" y="1240" class="mono" font-size="10" fill="#868e96">raised</text>
    <text x="402" y="1240" class="mono" font-size="10" fill="#868e96">edge</text>
    <text x="512" y="1240" class="mono" font-size="10" fill="#868e96">deep</text>
    <text x="622" y="1240" class="mono" font-size="10" fill="#868e96">brand</text>
    <text x="732" y="1240" class="mono" font-size="10" fill="#868e96">accent</text>
    <text x="842" y="1240" class="mono" font-size="10" fill="#868e96">tint</text>
    <text x="990" y="1170" class="mono" font-size="12"
      fill="#adb5bd">Ink is the brand theme. Light mode is a</text>
    <text x="990" y="1194" class="mono" font-size="12"
      fill="#adb5bd">supported reading theme. Grain at 4%,</text>
    <text x="990" y="1218" class="mono" font-size="12"
      fill="#adb5bd">grid hairlines at 3.5%, 72px pitch.</text>
  </g>

  <!-- 04 annotation system -->
  <text x="72" y="1330" class="mono" font-size="12" font-weight="700" fill="#8262db"
    letter-spacing="3">04 / ANNOTATION SYSTEM</text>
  <line x1="0" y1="1354.5" x2="1440" y2="1354.5" stroke="#ffffff" stroke-opacity="0.08" />
  <g class="mono">
    <text x="72" y="1400" font-size="11" fill="#868e96">SIDENOTES — left margin,</text>
    <text x="72" y="1422" font-size="11" fill="#868e96">tied to § clauses:</text>
    <text x="72" y="1462" font-size="11" fill="#868e96">§1</text>
    <text x="72" y="1486" font-size="11" fill="#868e96">PREREQ:</text>
    <text x="72" y="1510" font-size="11" fill="#868e96">DENO 2.x</text>
    <text x="420" y="1400" font-size="11" fill="#868e96">SPEC STAMPS — right meta:</text>
    <text x="420" y="1430" font-size="12" fill="#868e96">EST. 2026 / SPEC-041</text>
    <text x="820" y="1400" font-size="11" fill="#868e96">CLAUSE MARKERS:</text>
    <text x="820" y="1442" font-size="16" font-weight="800"
      fill="#f3eaff">§2 — Run the dev server</text>
    <text x="1180" y="1400" font-size="11" fill="#868e96">FOOTNOTES</text>
    <text x="1180" y="1430" font-size="11" fill="#868e96">※ truth that must</text>
    <text x="1180" y="1452" font-size="11" fill="#868e96">not scroll past</text>
  </g>

  <!-- 05 components -->
  <text x="72" y="1560" class="mono" font-size="12" font-weight="700" fill="#8262db"
    letter-spacing="3">05 / COMPONENTS</text>
  <line x1="0" y1="1584.5" x2="1440" y2="1584.5" stroke="#ffffff" stroke-opacity="0.08" />
  <g>
    <rect x="72" y="1614" width="176" height="50" rx="9999" fill="#8262db" />
    <text x="108" y="1645" class="mono" font-size="14" font-weight="700"
      fill="#fbf7ff">Primary pill</text>
    <rect x="272" y="1614" width="190" height="50" rx="9999" fill="none" stroke="#58399e"
      stroke-width="1.5" />
    <text x="304" y="1645" class="mono" font-size="14" font-weight="500"
      fill="#e9ecef">Ghost pill</text>
    <rect x="500" y="1622" width="110" height="30" rx="9999" fill="#21143b" stroke="#58399e" />
    <text x="518" y="1642" class="mono" font-size="11.5" font-weight="700"
      fill="#b59cff">BADGE</text>
    <rect x="660" y="1614" width="330" height="60" rx="12" fill="#100a1c" stroke="#ffffff"
      stroke-opacity="0.09" />
    <line x1="660" y1="1615" x2="990" y2="1615" stroke="#b59cff" stroke-opacity="0.55" />
    <text x="684" y="1650" class="mono" font-size="12" fill="#4ade80">$ </text>
    <text x="704" y="1650" class="mono" font-size="12" fill="#e9ecef">deno task dev</text>
    <rect x="1030" y="1614" width="338" height="60" rx="12" fill="#130a22" stroke="#58399e" />
    <rect x="1030" y="1614" width="4" height="60" fill="#8262db" />
    <text x="1058" y="1650" class="mono" font-size="12"
      fill="#adb5bd">Left-bar callout — the only card variant.</text>
  </g>
  <text x="72" y="1730" class="mono" font-size="11"
    fill="#868e96">Cards keep the top edge-highlight from the alpha line. Pills remain the only buttons. Everything else is type + hairlines.</text>
</svg>
