<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <pattern id="grid4" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.04"
        stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1440" height="1180" fill="#0a0714" />
  <rect width="1440" height="1180" fill="url(#grid4)" />

  <!-- nav -->
  <text x="80" y="58" class="mono" font-size="19" font-weight="800"
    fill="#f3eaff">&lt;open/&gt;</text>
  <rect x="500" y="30" width="440" height="40" rx="9999" fill="#130a22" fill-opacity="0.85"
    stroke="#ffffff" stroke-opacity="0.08" />
  <text x="544" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Docs</text>
  <text x="614" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">API</text>
  <text x="676" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Roadmap</text>
  <text x="776" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Blog</text>
  <text x="840" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">GitHub</text>
  <rect x="1310" y="32" width="112" height="36" rx="9999" fill="#8262db" />
  <text x="1328" y="55" class="mono" font-size="12.5" font-weight="700"
    fill="#fbf7ff">Get started</text>
  <line x1="0" y1="80.5" x2="1440" y2="80.5" stroke="#ffffff" stroke-opacity="0.07" />

  <!-- sidebar -->
  <g>
    <text x="80" y="150" class="mono" font-size="11" font-weight="700" fill="#868e96"
      letter-spacing="2">REFERENCE</text>
    <text x="80" y="186" class="mono" font-size="13" fill="#adb5bd">API Reference</text>
    <text x="80" y="222" class="mono" font-size="13" fill="#adb5bd">Design System</text>
    <text x="80" y="258" class="mono" font-size="13" fill="#adb5bd">Standards Contract</text>
    <text x="80" y="304" class="mono" font-size="11" font-weight="700" fill="#868e96"
      letter-spacing="2">PRINCIPLES</text>
    <rect x="72" y="322" width="196" height="34" rx="8" fill="#21143b" />
    <rect x="72" y="322" width="3" height="34" fill="#8262db" />
    <text x="92" y="344" class="mono" font-size="13" font-weight="700"
      fill="#f3eaff">Architecture</text>
    <text x="92" y="392" class="mono" font-size="13" fill="#adb5bd">Comparison</text>
    <text x="92" y="428" class="mono" font-size="13" fill="#adb5bd">DSD Rendering</text>
    <text x="92" y="464" class="mono" font-size="13" fill="#adb5bd">Islands</text>
  </g>

  <!-- hero: title column hard-capped, panel sits BELOW-RIGHT, never overlapping -->
  <g>
    <text x="320" y="170" class="mono" font-size="12" fill="#868e96"
      letter-spacing="1">ADR-0113 / V0.41.0 — STABLE LINE</text>
    <text x="316" y="258" class="mono" font-size="56" font-weight="800" fill="#f3eaff"
      letter-spacing="-2.5">Current</text>
    <text x="316" y="326" class="serif" font-size="66" font-style="italic"
      fill="#b59cff">Architecture</text>
    <text x="320" y="392" class="mono" font-size="14.5"
      fill="#adb5bd">OpenElement is a Web Components-native, static-first</text>
    <text x="320" y="418" class="mono" font-size="14.5"
      fill="#adb5bd">application framework. Custom Elements are the durable</text>
    <text x="320" y="444" class="mono" font-size="14.5"
      fill="#adb5bd">component contract; Vite and Nitro are the official</text>
    <text x="320" y="470" class="mono" font-size="14.5" fill="#adb5bd">build and output path.</text>
    <!-- package graph panel: own grid cell, right column, vertically centered against lede -->
    <g>
      <rect x="900" y="150" width="460" height="330" rx="12" fill="#100a1c" stroke="#ffffff"
        stroke-opacity="0.09" />
      <line x1="900" y1="151" x2="1360" y2="151" stroke="#b59cff" stroke-opacity="0.55" />
      <text x="928" y="184" class="mono" font-size="11" font-weight="700" fill="#868e96"
        letter-spacing="1.5">PACKAGE GRAPH</text>
      <text x="1190" y="184" class="mono" font-size="11" fill="#4ade80">V0.41.0 PUBLISHED</text>
      <g class="mono" font-size="13">
        <text x="928" y="232" fill="#b59cff" font-weight="700">@openelement/element</text>
        <text x="1210" y="232" fill="#adb5bd">elements</text>
        <line x1="928" y1="252" x2="1332" y2="252" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="928" y="284" fill="#b59cff" font-weight="700">@openelement/app</text>
        <text x="1210" y="284" fill="#adb5bd">pages</text>
        <line x1="928" y1="304" x2="1332" y2="304" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="928" y="336" fill="#b59cff" font-weight="700">@openelement/adapter-vite</text>
        <text x="1210" y="336" fill="#adb5bd">build</text>
        <line x1="928" y1="356" x2="1332" y2="356" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="928" y="388" fill="#b59cff" font-weight="700">@openelement/create</text>
        <text x="1210" y="388" fill="#adb5bd">starter</text>
        <line x1="928" y1="408" x2="1332" y2="408" stroke="#ffffff" stroke-opacity="0.06" />
        <text x="928" y="440" fill="#b59cff" font-weight="700">@openelement/ui</text>
        <text x="1210" y="440" fill="#adb5bd">optional</text>
      </g>
    </g>
  </g>

  <!-- section frames -->
  <g>
    <line x1="320" y1="560" x2="1360" y2="560" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="320" y="616" class="mono" font-size="13" font-weight="700" fill="#58399e"
      letter-spacing="3">01</text>
    <text x="320" y="662" class="mono" font-size="24" font-weight="800"
      fill="#f3eaff">Element owns the runtime</text>
    <text x="760" y="620" class="mono" font-size="13"
      fill="#adb5bd">The browser/runtime implementation and the</text>
    <text x="760" y="646" class="mono" font-size="13"
      fill="#adb5bd">runtime contracts. Zero framework dependencies;</text>
    <text x="760" y="672" class="mono" font-size="13"
      fill="#adb5bd">the only engine is @preact/signals-core, internal.</text>
    <line x1="320" y1="720" x2="1360" y2="720" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="320" y="776" class="mono" font-size="13" font-weight="700" fill="#58399e"
      letter-spacing="3">02</text>
    <text x="320" y="822" class="mono" font-size="24" font-weight="800"
      fill="#f3eaff">App owns the semantics</text>
    <text x="760" y="780" class="mono" font-size="13"
      fill="#adb5bd">Pages, routing, islands and request/render</text>
    <text x="760" y="806" class="mono" font-size="13"
      fill="#adb5bd">semantics. The router is internal; SPA types</text>
    <text x="760" y="832" class="mono" font-size="13"
      fill="#adb5bd">derive from SpaAppInstance.</text>
    <line x1="320" y1="880" x2="1360" y2="880" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="320" y="936" class="mono" font-size="13" font-weight="700" fill="#58399e"
      letter-spacing="3">03</text>
    <text x="320" y="982" class="mono" font-size="24" font-weight="800"
      fill="#f3eaff">Adapter Vite owns the build</text>
    <text x="760" y="940" class="mono" font-size="13"
      fill="#adb5bd">The only host-dependent package: Vite, content,</text>
    <text x="760" y="966" class="mono" font-size="13"
      fill="#adb5bd">static generation and Nitro output behind public</text>
    <text x="760" y="992" class="mono" font-size="13" fill="#adb5bd">build interfaces.</text>
  </g>

  <!-- footer -->
  <line x1="80" y1="1100" x2="1360" y2="1100" stroke="#ffffff" stroke-opacity="0.07" />
  <text x="80" y="1144" class="mono" font-size="12"
    fill="#868e96">&lt;open/&gt; — Web Components-native, static-first.</text>
  <text x="1100" y="1144" class="mono" font-size="12" fill="#868e96">MIT · v0.41.0</text>
</svg>
