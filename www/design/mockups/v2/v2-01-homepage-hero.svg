<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;500;700;800&amp;display=swap');
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .serif {
      font-family: 'Instrument Serif', serif;
    }
    </style>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8262db" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#58399e" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0a0714" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#b59cff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#130a22" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b59cff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#58399e" stop-opacity="0.15" />
    </linearGradient>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M 72 0 L 0 0 0 72" fill="none" stroke="#ffffff" stroke-opacity="0.045"
        stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="#0a0714" />
  <rect width="1440" height="900" fill="url(#grid)" />
  <circle cx="1010" cy="440" r="430" fill="url(#stageGlow)" />

  <!-- floating pixels -->
  <g fill="#b59cff">
    <rect x="272" y="180" width="14" height="14" opacity="0.35" />
    <rect x="352" y="96" width="10" height="10" opacity="0.22" />
    <rect x="520" y="140" width="16" height="16" opacity="0.28" />
    <rect x="640" y="230" width="9" height="9" opacity="0.30" />
    <rect x="250" y="430" width="11" height="11" opacity="0.25" />
    <rect x="420" y="560" width="13" height="13" opacity="0.20" />
    <rect x="600" y="700" width="10" height="10" opacity="0.26" />
    <rect x="1230" y="120" width="12" height="12" opacity="0.30" />
    <rect x="1330" y="300" width="9" height="9" opacity="0.22" />
    <rect x="1180" y="760" width="13" height="13" opacity="0.24" />
    <rect x="180" y="720" width="10" height="10" opacity="0.20" />
  </g>

  <!-- nav -->
  <g>
    <text x="80" y="58" class="mono" font-size="19" font-weight="800" fill="#f3eaff"
      letter-spacing="-0.5">&lt;open/&gt;</text>
    <rect x="500" y="30" width="440" height="40" rx="9999" fill="#130a22" fill-opacity="0.85"
      stroke="#ffffff" stroke-opacity="0.08" />
    <text x="544" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Docs</text>
    <text x="614" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">API</text>
    <text x="676" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Roadmap</text>
    <text x="776" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">Blog</text>
    <text x="840" y="55" class="mono" font-size="13" font-weight="500" fill="#adb5bd">GitHub</text>
    <circle cx="1236" cy="50" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="1230" y="55" class="mono" font-size="12" fill="#868e96">⌕</text>
    <circle cx="1280" cy="50" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.14" />
    <text x="1275" y="55" class="mono" font-size="12" fill="#868e96">☾</text>
    <rect x="1310" y="32" width="112" height="36" rx="9999" fill="#8262db" />
    <text x="1328" y="55" class="mono" font-size="12.5" font-weight="700"
      fill="#fbf7ff">Get started</text>
    <line x1="0" y1="80.5" x2="1440" y2="80.5" stroke="#ffffff" stroke-opacity="0.07" />
  </g>

  <!-- left column -->
  <g>
    <line x1="80" y1="196" x2="112" y2="196" stroke="#8262db" stroke-width="2" />
    <text x="124" y="201" class="mono" font-size="13" font-weight="500" fill="#b59cff"
      letter-spacing="3.5">OPENELEMENT — WEB STANDARDS LAB</text>

    <text x="76" y="320" class="mono" font-size="96" font-weight="800" fill="#f3eaff"
      letter-spacing="-5">The Web,</text>
    <text x="76" y="438" class="serif" font-size="128" font-style="italic" fill="#b59cff"
      letter-spacing="-2">composed.</text>

    <text x="80" y="512" class="mono" font-size="17"
      fill="#adb5bd">A Web Components-native application framework for</text>
    <text x="80" y="542" class="mono" font-size="17"
      fill="#adb5bd">beautiful, static-first applications — composed from</text>
    <text x="80" y="572" class="mono" font-size="17"
      fill="#adb5bd">real browser primitives, not framework abstractions.</text>

    <rect x="80" y="616" width="176" height="50" rx="9999" fill="#8262db" />
    <text x="114" y="647" class="mono" font-size="14.5" font-weight="700"
      fill="#fbf7ff">Start building</text>
    <rect x="272" y="616" width="190" height="50" rx="9999" fill="none" stroke="#58399e"
      stroke-width="1.5" />
    <text x="302" y="647" class="mono" font-size="14.5" font-weight="500"
      fill="#e9ecef">Watch it unfold</text>

    <text x="80" y="716" class="mono" font-size="12" fill="#868e96"
      letter-spacing="0.5">v0.41.0 — the stable five-package line · Declarative Shadow DOM inside</text>
  </g>

  <!-- right stage: element cross-section -->
  <g>
    <!-- orbit arc accent -->
    <path d="M 860 260 A 250 250 0 0 1 1210 610" fill="none" stroke="url(#arcGrad)"
      stroke-width="1.5" />
    <!-- host boundary -->
    <circle cx="1010" cy="440" r="218" fill="none" stroke="#58399e" stroke-width="1.5"
      stroke-dasharray="2 9" stroke-linecap="round" />
    <!-- shadow root -->
    <circle cx="1010" cy="440" r="158" fill="url(#coreGlow)" stroke="#8262db" stroke-width="1.5" />
    <!-- core -->
    <circle cx="1010" cy="440" r="86" fill="#130a22" stroke="#b59cff" stroke-width="1.5" />
    <circle cx="1010" cy="440" r="86" fill="none" stroke="#ffffff" stroke-opacity="0.10"
      stroke-width="1" transform="translate(0,-1)" />
    <text x="968" y="450" class="mono" font-size="24" font-weight="800" fill="#f3eaff"
      letter-spacing="-1">&lt;open/&gt;</text>

    <!-- orbit chips -->
    <g>
      <rect x="1136" y="238" width="64" height="30" rx="9999" fill="#21143b" stroke="#58399e" />
      <text x="1156" y="258" class="mono" font-size="11.5" font-weight="700"
        fill="#b59cff">DSD</text>
      <rect x="806" y="576" width="86" height="30" rx="9999" fill="#21143b" stroke="#58399e" />
      <text x="820" y="596" class="mono" font-size="11.5" font-weight="700"
        fill="#b59cff">ISLANDS</text>
      <rect x="1206" y="560" width="88" height="30" rx="9999" fill="#21143b" stroke="#58399e" />
      <text x="1219" y="580" class="mono" font-size="11.5" font-weight="700"
        fill="#b59cff">SIGNALS</text>
    </g>

    <!-- annotations -->
    <g class="mono" font-size="11" fill="#868e96">
      <line x1="1228" y1="440" x2="1300" y2="440" stroke="#343a40" stroke-dasharray="3 4" />
      <text x="1310" y="444">host element</text>
      <line x1="1010" y1="282" x2="1010" y2="220" stroke="#343a40" stroke-dasharray="3 4" />
      <text x="1022" y="226">shadow root</text>
      <line x1="948" y1="504" x2="890" y2="556" stroke="#343a40" stroke-dasharray="3 4" />
      <text x="800" y="536" text-anchor="end">hydrated core</text>
    </g>
  </g>

  <!-- scroll cue -->
  <g>
    <line x1="80" y1="838" x2="1360" y2="838" stroke="#ffffff" stroke-opacity="0.07" />
    <text x="622" y="872" class="mono" font-size="11" fill="#868e96"
      letter-spacing="4">SCROLL TO COMPOSE ↓</text>
  </g>
</svg>
