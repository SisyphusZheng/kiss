  <text
    class="sans"
    x="300"
    y="140"
    font-size="44"
    font-weight="600"
    fill="#e9ecef"
    letter-spacing="-0.03em"
  >How DSD Rendering Eliminates FOUC</text>
  <text
    class="sans"
    x="300"
    y="210"
    font-size="19"
    font-weight="400"
    fill="#adb5bd"
  >Declarative Shadow DOM renders Web Components on the server, so the browser paints them before JavaScript loads.</text>
