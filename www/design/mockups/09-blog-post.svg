    >&quot;open&quot;</text>
    <text class="mono" x="277.4" y="86" font-size="13" font-weight="400" fill="#fbbf24">&gt;</text>
    <text class="mono" x="20" y="106" font-size="13" font-weight="400" fill="#fbbf24">&lt;</text>
