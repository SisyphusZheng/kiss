    y="896"
    font-size="16"
    font-weight="400"
    fill="#adb5bd"
    line-height="1.7"
  >openElement generates DSD output at build time. Every page is pre-rendered to static HTML with full shadow DOM structure. JavaScript upgrades happen asynchronously via islands — only interactive bits hydrate.</text>
