  >performance</text>
  <line x1="300" y1="312" x2="980" y2="312" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
  <text
    class="sans"
    x="300"
    y="340"
    font-size="16"
    font-weight="400"
    fill="#adb5bd"
    line-height="1.7"
  >FOUC — the Flash of Unstyled Content — has been the web's most persistent rendering problem since Web Components were introduced. Custom elements need JavaScript to define themselves. Until that script loads and executes, the browser displays unknown HTML tags as generic inline elements.</text>
  <text
    class="sans"
    x="300"
    y="460"
    font-size="26"
    font-weight="600"
    fill="#e9ecef"
  >The Problem</text>
  <text
    class="sans"
    x="300"
    y="500"
    font-size="16"
    font-weight="400"
    fill="#adb5bd"
  >Traditional Web Components follow this path:</text>
  <g transform="translate(300,540)">
    <rect
      x="0"
      y="0"
      width="680"
      height="56"
      rx="8"
      fill="#16191d"
      stroke="rgba(255,255,255,0.06)"
      stroke-width="1"
    />
    <text
      class="mono"
      x="20"
      y="22"
      font-size="13"
      font-weight="400"
      fill="#adb5bd"
    >1. Browser parses &lt;my-element&gt; as unknown inline element</text>
    <text
      class="mono"
      x="20"
      y="42"
      font-size="13"
      font-weight="400"
      fill="#adb5bd"
    >2. JS defines the class → browser upgrades → FOUC on slow connections</text>
  </g>
  <text
    class="sans"
    x="300"
    y="630"
    font-size="26"
    font-weight="600"
    fill="#e9ecef"
  >The Solution: Declarative Shadow DOM</text>
  <text
    class="sans"
    x="300"
    y="670"
    font-size="16"
    font-weight="400"
    fill="#adb5bd"
  >DSD flips the model. Instead of waiting for JavaScript, the shadow DOM structure is declared in the HTML itself using the shadowrootmode attribute.</text>
  <g transform="translate(300,706)">
    <rect
      x="0"
      y="0"
      width="680"
      height="150"
      rx="10"
      fill="#0d0f12"
      stroke="rgba(255,255,255,0.06)"
      stroke-width="1"
    />
    <line x1="6" y1="0" x2="674" y2="0" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <circle cx="18" cy="19" r="5" fill="#ff5f57" />
