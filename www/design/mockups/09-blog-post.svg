      font-weight="400"
      fill="#868e96"
    >output.html</text>
    <line x1="0" y1="40" x2="680" y2="40" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    <text class="mono" x="20" y="66" font-size="13" font-weight="400" fill="#fbbf24">&lt;</text>
    <text
