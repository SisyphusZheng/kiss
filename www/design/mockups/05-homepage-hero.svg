<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="900" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="#08080a"/>
  
  <!-- === NAV === -->
  <g id="nav">
    <rect x="0" y="0" width="1440" height="56" fill="#08080a"/>
    <text x="32" y="30" font-size="18" font-weight="600" fill="#e9ecef" text-anchor="start">openElement</text>
    <text x="750" y="30" font-size="14" font-weight="400" fill="#adb5bd" text-anchor="start">Guide</text>
    <text x="830" y="30" font-size="14" font-weight="400" fill="#adb5bd" text-anchor="start">API</text>
    <text x="910" y="30" font-size="14" font-weight="400" fill="#adb5bd" text-anchor="start">Architecture</text>
    <text x="1010" y="30" font-size="14" font-weight="400" fill="#adb5bd" text-anchor="start">Blog</text>
    <!-- GitHub btn -->
    <rect x="1220" y="12" width="90" height="32" rx="8" fill="#0d0f12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="1265" y="33" font-size="14" font-weight="500" fill="#e9ecef" text-anchor="middle">GitHub</text>
    <!-- Get started btn -->
    <rect x="1320" y="12" width="100" height="32" rx="8" fill="#5c7cfa"/>
    <text x="1370" y="33" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Get started</text>
  </g>
  
  <!-- === HERO === -->
  <g id="hero">
    <!-- Eyebrow -->
    <text x="80" y="150" font-size="13" font-weight="500" fill="#5c7cfa" letter-spacing="0.04em">openElement 0.40.7 / v0.40.7 active</text>
    
    <!-- Headline -->
    <text x="80" y="240" font-size="80" font-weight="600" fill="#e9ecef" letter-spacing="-0.04em">THE OPEN</text>
    <text x="80" y="330" font-size="80" font-weight="600" fill="#5c7cfa" letter-spacing="-0.04em">ELEMENT.</text>
    
    <!-- Subhead -->
    <text x="80" y="400" font-size="18" font-weight="400" fill="#adb5bd" line-height="1.5">A four-product Web Components platform:</text>
    <text x="80" y="428" font-size="18" font-weight="400" fill="#adb5bd">Elements, UI, Framework, and Protocols.</text>
    <text x="80" y="456" font-size="18" font-weight="400" fill="#adb5bd">JSX pages, one VNode renderer, structured route</text>
    <text x="80" y="484" font-size="18" font-weight="400" fill="#adb5bd">lifecycle, explicit trusted HTML boundaries,</text>
    <text x="80" y="512" font-size="18" font-weight="400" fill="#adb5bd">and island JavaScript that upgrades only where needed.</text>
    
    <!-- CTA Buttons -->
    <rect x="80" y="545" width="140" height="36" rx="8" fill="#5c7cfa"/>
    <text x="150" y="568" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Start building</text>
    
    <rect x="240" y="545" width="180" height="36" rx="8" fill="#0d0f12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="330" y="568" font-size="14" font-weight="500" fill="#e9ecef" text-anchor="middle">Read architecture</text>
  </g>
  
  <!-- === CODE PANEL (right) === -->
  <g id="code-panel">
    <rect x="760" y="160" width="560" height="440" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Top edge highlight -->
    <line x1="766" y1="160" x2="1314" y2="160" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- macOS dots -->
    <circle cx="776" cy="176" r="5" fill="#ff5f57"/>
    <circle cx="794" cy="176" r="5" fill="#febc2e"/>
    <circle cx="812" cy="176" r="5" fill="#28c840"/>
    <!-- Title bar line -->
    <line x1="760" y1="200" x2="1320" y2="200" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Code content -->
    <text x="784" y="230" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">import</text>
    <text x="830" y="230" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef"> &#123; definePage &#125; </text>
    <text x="920" y="230" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">from </text>
    <text x="950" y="230" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#5c7cfa">'@openelement/app'</text>
    <text x="784" y="250" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">;</text>
    <text x="784" y="280" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">export default definePage(&#123;</text>
    <text x="784" y="300" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">  route: &#123; path: </text>
    <text x="910" y="300" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#5c7cfa">'/'</text>
    <text x="930" y="300" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef"> &#125;,</text>
    <text x="784" y="320" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">  head: &#123; title: </text>
    <text x="910" y="320" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#5c7cfa">'Home'</text>
    <text x="960" y="320" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef"> &#125;,</text>
    <text x="784" y="340" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">  render() &#123;</text>
    <text x="784" y="360" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">    return </text>
    <text x="850" y="360" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#5c7cfa">&lt;main&gt;</text>
    <text x="910" y="360" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">Hello openElement</text>
    <text x="1040" y="360" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#5c7cfa">&lt;/main&gt;</text>
    <text x="1090" y="360" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">;</text>
    <text x="784" y="380" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">  &#125;</text>
    <text x="784" y="400" font-size="13" font-family="'JetBrains Mono', 'SF Mono', monospace" fill="#e9ecef">&#125;);</text>
  </g>
</svg>