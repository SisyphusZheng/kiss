<?xml version="1.0" encoding="UTF-8"?>
<svg width="1440" height="2400" viewBox="0 0 1440 2400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
    </style>
  </defs>
  <rect width="1440" height="2400" fill="#08080a"/>
  
  <!-- === NAV === -->
  <g id="nav">
    <rect x="0" y="0" width="1440" height="56" fill="#08080a"/>
    <text x="32" y="30" font-size="18" font-weight="600" fill="#e9ecef">openElement</text>
    <text x="750" y="30" font-size="14" font-weight="400" fill="#adb5bd">Guide</text>
    <text x="830" y="30" font-size="14" font-weight="400" fill="#adb5bd">API</text>
    <text x="910" y="30" font-size="14" font-weight="400" fill="#adb5bd">Architecture</text>
    <text x="1010" y="30" font-size="14" font-weight="400" fill="#adb5bd">Blog</text>
    <rect x="1220" y="12" width="90" height="32" rx="8" fill="#0d0f12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="1265" y="33" font-size="14" font-weight="500" fill="#e9ecef" text-anchor="middle">GitHub</text>
    <rect x="1320" y="12" width="100" height="32" rx="8" fill="#5c7cfa"/>
    <text x="1370" y="33" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Get started</text>
  </g>
  
  <!-- === HERO === -->
  <g id="hero">
    <text x="80" y="150" font-size="13" font-weight="500" fill="#5c7cfa" letter-spacing="0.04em">openElement 0.40.7 / v0.40.7 active</text>
    <text x="80" y="240" font-size="80" font-weight="600" fill="#e9ecef" letter-spacing="-0.04em">THE OPEN</text>
    <text x="80" y="330" font-size="80" font-weight="600" fill="#5c7cfa" letter-spacing="-0.04em">ELEMENT.</text>
    <text x="80" y="400" font-size="18" font-weight="400" fill="#adb5bd">A four-product Web Components platform:</text>
    <text x="80" y="428" font-size="18" font-weight="400" fill="#adb5bd">Elements, UI, Framework, and Protocols.</text>
    <text x="80" y="456" font-size="18" font-weight="400" fill="#adb5bd">JSX pages, one VNode renderer, structured route</text>
    <text x="80" y="484" font-size="18" font-weight="400" fill="#adb5bd">lifecycle, explicit trusted HTML boundaries,</text>
    <text x="80" y="512" font-size="18" font-weight="400" fill="#adb5bd">and island JavaScript that upgrades only where needed.</text>
    <rect x="80" y="545" width="140" height="36" rx="8" fill="#5c7cfa"/>
    <text x="150" y="568" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Start building</text>
    <rect x="240" y="545" width="180" height="36" rx="8" fill="#0d0f12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="330" y="568" font-size="14" font-weight="500" fill="#e9ecef" text-anchor="middle">Read architecture</text>
  </g>
  
  <!-- Code Panel -->
  <g id="code-panel">
    <rect x="760" y="140" width="560" height="420" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="766" y1="140" x2="1314" y2="140" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <circle cx="776" cy="156" r="5" fill="#ff5f57"/>
    <circle cx="794" cy="156" r="5" fill="#febc2e"/>
    <circle cx="812" cy="156" r="5" fill="#28c840"/>
    <line x1="760" y1="180" x2="1320" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="784" y="210" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">import &#123; definePage &#125; from '@openelement/app';</text>
    <text x="784" y="240" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">export default definePage(&#123;</text>
    <text x="784" y="260" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  route: &#123; path: '/' &#125;,</text>
    <text x="784" y="280" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  head: &#123; title: 'Home' &#125;,</text>
    <text x="784" y="300" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  render() &#123;</text>
    <text x="784" y="320" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">    return &lt;main&gt;Hello openElement&lt;/main&gt;;</text>
    <text x="784" y="340" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  &#125;</text>
    <text x="784" y="360" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">&#125;);</text>
  </g>
  
  <!-- === FEATURES === -->
  <g id="features">
    <text x="80" y="650" font-size="13" font-weight="500" fill="#5c7cfa" letter-spacing="0.04em">Why openElement</text>
    <text x="80" y="690" font-size="40" font-weight="600" fill="#e9ecef" letter-spacing="-0.02em">Static-first Web Components without duplicate render paths.</text>
    <g id="feature-card-1">
      <rect x="80" y="650" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="86" y1="650" x2="474" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="104" y="674" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="104" y="730" font-size="22" font-weight="500" fill="#e9ecef">Elements-first</text>
      <text x="104" y="760" font-size="14" font-weight="400" fill="#adb5bd">OpenElement is the future Elements</text>
      <text x="104" y="782" font-size="14" font-weight="400" fill="#adb5bd">surface. Shadow/DSD remains the default</text>
      <text x="104" y="804" font-size="14" font-weight="400" fill="#adb5bd">render mode.</text>
    </g>
    <g id="feature-card-2">
      <rect x="504" y="650" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="510" y1="650" x2="898" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="528" y="674" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="528" y="730" font-size="22" font-weight="500" fill="#e9ecef">One renderer</text>
      <text x="528" y="760" font-size="14" font-weight="400" fill="#adb5bd">JSX becomes VNode IR. SSR, CSR,</text>
      <text x="528" y="782" font-size="14" font-weight="400" fill="#adb5bd">signals, and events share the same</text>
      <text x="528" y="804" font-size="14" font-weight="400" fill="#adb5bd">structural model.</text>
    </g>
    <g id="feature-card-3">
      <rect x="928" y="650" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="934" y1="650" x2="1322" y2="650" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="952" y="674" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="952" y="730" font-size="22" font-weight="500" fill="#e9ecef">App lifecycle</text>
      <text x="952" y="760" font-size="14" font-weight="400" fill="#adb5bd">Route params, load context, route</text>
      <text x="952" y="782" font-size="14" font-weight="400" fill="#adb5bd">metadata, redirect, not-found, and</text>
      <text x="952" y="804" font-size="14" font-weight="400" fill="#adb5bd">error fallback.</text>
    </g>
    <g id="feature-card-4">
      <rect x="80" y="894" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="86" y1="894" x2="474" y2="894" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="104" y="918" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="104" y="974" font-size="22" font-weight="500" fill="#e9ecef">Trusted boundary</text>
      <text x="104" y="1004" font-size="14" font-weight="400" fill="#adb5bd">HTML injection is explicit and reserved</text>
      <text x="104" y="1026" font-size="14" font-weight="400" fill="#adb5bd">for pre-sanitized non-interactive</text>
      <text x="104" y="1048" font-size="14" font-weight="400" fill="#adb5bd">content.</text>
    </g>
    <g id="feature-card-5">
      <rect x="504" y="894" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="510" y1="894" x2="898" y2="894" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="528" y="918" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="528" y="974" font-size="22" font-weight="500" fill="#e9ecef">Gate-proven</text>
      <text x="528" y="1004" font-size="14" font-weight="400" fill="#adb5bd">AutoFlow3, package graph validation,</text>
      <text x="528" y="1026" font-size="14" font-weight="400" fill="#adb5bd">and workflow slimming guard the</text>
      <text x="528" y="1048" font-size="14" font-weight="400" fill="#adb5bd">14-package line.</text>
    </g>
    <g id="feature-card-6">
      <rect x="928" y="894" width="400" height="220" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      <line x1="934" y1="894" x2="1322" y2="894" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <rect x="952" y="918" width="32" height="32" rx="6" fill="#5c7cfa"/>
      <text x="952" y="974" font-size="22" font-weight="500" fill="#e9ecef">Web standards</text>
      <text x="952" y="1004" font-size="14" font-weight="400" fill="#adb5bd">Custom Elements, Shadow DOM,</text>
      <text x="952" y="1026" font-size="14" font-weight="400" fill="#adb5bd">CSSStyleSheet, URL, fetch, and Web</text>
      <text x="952" y="1048" font-size="14" font-weight="400" fill="#adb5bd">Streams at the center.</text>
    </g>
  </g>
  
  <!-- === SHOWCASE === -->
  <g id="showcase">
    <rect x="0" y="1280" width="1440" height="600" fill="#0d0f12"/>
    <text x="80" y="1340" font-size="13" font-weight="500" fill="#5c7cfa" letter-spacing="0.04em">How it works</text>
    <text x="80" y="1380" font-size="40" font-weight="600" fill="#e9ecef" letter-spacing="-0.02em">One pipeline. Zero runtime overhead.</text>
    <rect x="80" y="1460" width="1280" height="360" rx="12" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="86" y1="1460" x2="1354" y2="1460" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Tabs -->
    <rect x="104" y="1476" width="60" height="30" rx="6" fill="#212529"/>
    <text x="134" y="1495" font-size="13" font-weight="500" fill="#e9ecef" text-anchor="middle">JSX</text>
    <rect x="174" y="1476" width="60" height="30" rx="6" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="204" y="1495" font-size="13" font-weight="500" fill="#868e96" text-anchor="middle">DSD</text>
    <rect x="244" y="1476" width="60" height="30" rx="6" fill="#16191d" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="274" y="1495" font-size="13" font-weight="500" fill="#868e96" text-anchor="middle">DOM</text>
    <line x1="80" y1="1516" x2="1360" y2="1516" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <!-- Code in showcase -->
    <text x="104" y="1540" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">import &#123; definePage &#125; from '@openelement/app';</text>
    <text x="104" y="1560" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">export default definePage(&#123;</text>
    <text x="104" y="1580" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  route: &#123; path: '/' &#125;,</text>
    <text x="104" y="1600" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  render() &#123;</text>
    <text x="104" y="1620" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">    return &lt;main&gt;Hello openElement&lt;/main&gt;;</text>
    <text x="104" y="1640" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">  &#125;</text>
    <text x="104" y="1660" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">&#125;);</text>
  </g>
  
  <!-- === CTA === -->
  <g id="cta">
    <text x="80" y="1960" font-size="40" font-weight="600" fill="#e9ecef" letter-spacing="-0.02em">Ready to build with Web Standards?</text>
    <text x="80" y="2020" font-size="20" font-weight="400" fill="#adb5bd">Get started in 30 seconds.</text>
    <rect x="80" y="2080" width="600" height="36" rx="8" fill="#0d0f12" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="90" y="2103" font-size="13" font-family="'JetBrains Mono', monospace" fill="#e9ecef">deno run -A jsr:@openelement/create my-app</text>
    <rect x="700" y="2080" width="80" height="36" rx="8" fill="#16191d"/>
    <text x="740" y="2103" font-size="13" font-weight="500" fill="#adb5bd" text-anchor="middle">Copy</text>
    <rect x="80" y="2140" width="150" height="36" rx="8" fill="#5c7cfa"/>
    <text x="155" y="2163" font-size="14" font-weight="500" fill="#ffffff" text-anchor="middle">Read the docs</text>
  </g>
  
  <!-- === FOOTER === -->
  <g id="footer">
    <line x1="80" y1="2220" x2="1360" y2="2220" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="80" y="2260" font-size="18" font-weight="600" fill="#e9ecef">openElement</text>
    <text x="80" y="2290" font-size="14" font-weight="400" fill="#868e96">The Open Element for Web Components</text>
    <!-- Footer columns -->
    <text x="400" y="2260" font-size="14" font-weight="600" fill="#e9ecef">Product</text>
    <text x="400" y="2290" font-size="13" font-weight="400" fill="#868e96">Elements</text>
    <text x="400" y="2314" font-size="13" font-weight="400" fill="#868e96">UI</text>
    <text x="400" y="2338" font-size="13" font-weight="400" fill="#868e96">Framework</text>
    <text x="400" y="2362" font-size="13" font-weight="400" fill="#868e96">Protocols</text>
    
    <text x="580" y="2260" font-size="14" font-weight="600" fill="#e9ecef">Resources</text>
    <text x="580" y="2290" font-size="13" font-weight="400" fill="#868e96">Guide</text>
    <text x="580" y="2314" font-size="13" font-weight="400" fill="#868e96">API</text>
    <text x="580" y="2338" font-size="13" font-weight="400" fill="#868e96">Architecture</text>
    <text x="580" y="2362" font-size="13" font-weight="400" fill="#868e96">Blog</text>
    
    <text x="760" y="2260" font-size="14" font-weight="600" fill="#e9ecef">Company</text>
    <text x="760" y="2290" font-size="13" font-weight="400" fill="#868e96">GitHub</text>
    <text x="760" y="2314" font-size="13" font-weight="400" fill="#868e96">JSR</text>
    <text x="760" y="2338" font-size="13" font-weight="400" fill="#868e96">Changelog</text>
    
    <text x="940" y="2260" font-size="14" font-weight="600" fill="#e9ecef">Legal</text>
    <text x="940" y="2290" font-size="13" font-weight="400" fill="#868e96">MIT License</text>
    <text x="940" y="2314" font-size="13" font-weight="400" fill="#868e96">Contributing</text>
  </g>
</svg>