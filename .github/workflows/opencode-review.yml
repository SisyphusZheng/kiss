name: opencode-review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Third-party AI review is supplemental; Dependabot updates need no review.
    # The review must actually execute: the action posts provider errors as PR
    # comments while exiting 0, so the verify step below fails the job closed
    # when no genuine review exists for this run (#1332, #1343 prerequisite).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pinned to the `latest` tag as of 2026-08 (anomalyco/opencode@latest)
      # SHA: 2c14fc5586fe0b88e5c04732d2e846769cc35671
      - uses: anomalyco/opencode/github@2c14fc5586fe0b88e5c04732d2e846769cc35671
        id: opencode
        # Keeps running so the outcome gate below always evaluates and reports;
        # it — not this step — decides the job result.
        continue-on-error: true
        env:
          # DeepSeek API key. Get one at https://platform.deepseek.com/api_keys
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # DeepSeek provider/model. Other options: deepseek/deepseek-v4-flash
          model: deepseek/deepseek-v4-pro
          use_github_token: true
          prompt: |
            Review this pull request for the openElement project:
            - Check for code quality issues, potential bugs, and regressions.
            - Look for over-engineering, unnecessary abstractions, and unused code.
            - Verify TypeScript types, ESM imports, and Deno conventions.
            - Suggest concrete improvements with line-specific comments when possible.
            - Keep the summary brief; prioritize bugs > readability > style > nits.

      # v2.0.5
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        if: always()
        with:
          deno-version-file: .dvmrc

      - name: Fail closed when the review did not execute
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REVIEW_STEP_OUTCOME: ${{ steps.opencode.outcome }}
        run: deno run --allow-env --allow-net=api.github.com tools/check-review-outcome.ts
