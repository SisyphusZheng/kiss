name: Supabase project smoke (real project)

# #984 tier 2: qualifies the Supabase × Cloudflare reference starter against
# the REAL Supabase project (maintainer-provided repo secrets). Per the
# maintainer realignment, the real project is the primary fullstack evidence:
# it proves real Auth admin/API behavior, session cookies, and RLS scoping —
# things the local emulator can only approximate. The emulator path is
# therefore the PR-safe FALLBACK, not the primary evidence: PRs are covered
# by tier-1 (tools/check-fullstack-boundary.ts, `deno task
# fullstack:boundary-check`, wired into the autoflow ci/release tiers), which
# gates the built output without any credentials.
#
# Manual + weekly only: never runs on push/PR. Requires secrets SUPABASE_URL,
# SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY.

on:
  workflow_dispatch:
    inputs:
      migration_mode:
        description: Check/apply committed migrations before provider qualification
        required: true
        default: skip
        type: choice
        options:
          - skip
          - check
          - apply
  schedule:
    # Mondays 06:00 UTC
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: supabase-real-project
  cancel-in-progress: false

jobs:
  project-smoke:
    name: Qualify the reference starter against the real Supabase project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      # v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/setup-deno-workspace

      - name: Require dedicated migration credentials
        if: ${{ inputs.migration_mode == 'check' || inputs.migration_mode == 'apply' }}
        run: |
          set -euo pipefail
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name:-}" ] || { echo "$name is not configured" >&2; exit 1; }
          done

      # v1, pinned 2026-08-17
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        if: ${{ inputs.migration_mode == 'check' || inputs.migration_mode == 'apply' }}
        with:
          version: 2.114.0

      - name: Link target, inspect history, and dry-run migrations
        if: ${{ inputs.migration_mode == 'check' || inputs.migration_mode == 'apply' }}
        working-directory: examples/supabase-cloudflare-starter
        run: |
          set -euo pipefail
          supabase --version | grep -Fx '2.114.0'
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase migration list --linked
          supabase db push --linked --dry-run

      - name: Apply committed migrations
        if: ${{ inputs.migration_mode == 'apply' }}
        working-directory: examples/supabase-cloudflare-starter
        run: supabase db push --linked --yes

      - name: Prove the linked project is current after apply
        if: ${{ inputs.migration_mode == 'apply' }}
        working-directory: examples/supabase-cloudflare-starter
        run: |
          set -euo pipefail
          output=$(supabase db push --linked --dry-run 2>&1)
          echo "$output"
          echo "$output" | grep -q 'Remote database is up to date.'

      - name: Install Chromium for the real browser journey
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Create two throwaway test users (Auth admin API)
        run: |
          set -euo pipefail
          mkdir -p .smoke
          RUN_ID="${{ github.run_id }}-${{ github.run_attempt }}"
          MARKER="oe-smoke-note-${RUN_ID}"
          {
            echo "RUN_ID=$RUN_ID"
            echo "MARKER=$MARKER"
          } > .smoke/smoke.env
          for u in a b; do
            email="oe-smoke-${RUN_ID}-${u}@example.com"
            password="oe-Smoke1!-${RUN_ID}-$(head -c4 /dev/urandom | od -An -tx1 | tr -d ' ')"
            response=$(curl -sf -X POST "$SUPABASE_URL/auth/v1/admin/users" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$email\",\"password\":\"$password\",\"email_confirm\":true}")
            id=$(echo "$response" | jq -r '.id')
            [ "$id" != "null" ] && [ -n "$id" ]
            U=$(echo "$u" | tr '[:lower:]' '[:upper:]')
            {
              echo "${U}_ID=$id"
              echo "${U}_EMAIL=$email"
              echo "${U}_PASSWORD=$password"
            } >> .smoke/smoke.env
            echo "created throwaway user $u (id redacted from logs)"
          done

      - name: Seed one private note for user A (service role, bypasses RLS by design)
        run: |
          set -euo pipefail
          source .smoke/smoke.env
          response=$(curl -sf -X POST "$SUPABASE_URL/rest/v1/notes" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"user_id\":\"$A_ID\",\"title\":\"smoke\",\"body\":\"$MARKER\"}")
          NOTE_ID=$(echo "$response" | jq -er '.[0].id')
          echo "NOTE_ID=$NOTE_ID" >> .smoke/smoke.env
          echo "seeded note with run-unique marker"

      - name: Build and start the reference starter
        working-directory: examples/supabase-cloudflare-starter
        run: |
          set -euo pipefail
          deno task build
          OPEN_ELEMENT_PORT=4173 nohup deno task start > "$GITHUB_WORKSPACE/.smoke/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:4173/; then break; fi
            sleep 1
          done
          curl -sf -o /dev/null http://127.0.0.1:4173/
          echo "reference starter is serving on :4173"

      - name: Curl the auth/RLS matrix against the running starter
        run: |
          set -euo pipefail
          source .smoke/smoke.env
          BASE=http://127.0.0.1:4173
          record() { echo "{\"check\":\"$1\",\"result\":\"$2\"}" >> .smoke/results.jsonl; }

          # 1. Anonymous /notes renders the denied branch (RLS floor underneath).
          anon=$(curl -s "$BASE/notes")
          echo "$anon" | grep -q "Sign-in is required"
          record anonymous-notes-denied pass
          # The denied page must never be publicly cacheable.
          curl -s -D - -o /dev/null "$BASE/notes" \
            | grep -i '^cache-control:' | grep -qiE 'no-store|private'
          record anonymous-notes-not-publicly-cacheable pass

          # 2. Login user A: PRG 303 + session cookie.
          code=$(curl -s -o /dev/null -w '%{http_code}' -c .smoke/jar-a \
            -X POST "$BASE/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "email=$A_EMAIL" \
            --data-urlencode "password=$A_PASSWORD")
          [ "$code" = "303" ]
          grep -q "auth-token" .smoke/jar-a
          record login-user-a-303-cookie pass

          # 3. User A sees their own seeded row, signed in as themselves.
          page_a=$(curl -s -b .smoke/jar-a "$BASE/notes")
          echo "$page_a" | grep -q "$MARKER"
          echo "$page_a" | grep -q "signed-in:$A_EMAIL"
          record user-a-sees-own-row pass

          # 3b. The application write action stamps user A, persists, and PRG redirects.
          CREATED_MARKER="created-$MARKER"
          code=$(curl -s -o /dev/null -w '%{http_code}' -b .smoke/jar-a \
            -X POST "$BASE/notes?/create" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "title=created by smoke" \
            --data-urlencode "body=$CREATED_MARKER")
          [ "$code" = "303" ]
          curl -s -b .smoke/jar-a "$BASE/notes" | grep -q "$CREATED_MARKER"
          record user-a-creates-note-via-action pass

          # 4. User B sees none of A's rows (cross-user RLS).
          code=$(curl -s -o /dev/null -w '%{http_code}' -c .smoke/jar-b \
            -X POST "$BASE/login" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "email=$B_EMAIL" \
            --data-urlencode "password=$B_PASSWORD")
          [ "$code" = "303" ]
          page_b=$(curl -s -b .smoke/jar-b "$BASE/notes")
          if echo "$page_b" | grep -q "$MARKER"; then
            record user-b-isolated-from-a fail
            echo "RLS BREACH: user B can see user A's row" >&2
            exit 1
          fi
          record user-b-isolated-from-a pass

          # 4b. Exercise database RLS directly with user B's JWT: attempts to
          # update/delete A's known row must affect zero rows.
          token_a=$(curl -sf -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$A_EMAIL\",\"password\":\"$A_PASSWORD\"}" | jq -er '.access_token')
          token_b=$(curl -sf -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' \
            -d "{\"email\":\"$B_EMAIL\",\"password\":\"$B_PASSWORD\"}" | jq -er '.access_token')
          changed=$(curl -sf -X PATCH "$SUPABASE_URL/rest/v1/notes?id=eq.$NOTE_ID" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_b" \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            -d '{"body":"cross-user overwrite"}')
          [ "$(echo "$changed" | jq 'length')" = "0" ]
          deleted=$(curl -sf -X DELETE "$SUPABASE_URL/rest/v1/notes?id=eq.$NOTE_ID" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_b" \
            -H 'Prefer: return=representation')
          [ "$(echo "$deleted" | jq 'length')" = "0" ]
          record user-b-update-delete-a-denied pass

          # 4c. Anonymous REST reads cannot observe any notes.
          anonymous_rows=$(curl -sf "$SUPABASE_URL/rest/v1/notes?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          [ "$(echo "$anonymous_rows" | jq 'length')" = "0" ]
          record anonymous-direct-rest-denied pass

          # 4d. The application upload is insert-only and enters the scan
          # lifecycle. It must not be downloadable before a clean verdict.
          printf 'smoke attachment' > .smoke/attachment.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -b .smoke/jar-a \
            -X POST "$BASE/upload?/upload" -F 'file=@.smoke/attachment.txt;type=text/plain')
          [ "$code" = "303" ]
          if curl -s -b .smoke/jar-b "$BASE/upload" | grep -q 'attachment.txt'; then
            record user-b-storage-isolated fail
            exit 1
          fi
          if curl -s -b .smoke/jar-a "$BASE/upload" | grep -q 'attachment.txt'; then
            record pending-scan-download-denied fail
            exit 1
          fi
          record storage-app-upload-pending-scan pass

          # 4e. Exercise each storage.objects policy operation through the
          # supported Storage API. The product surface is exactly
          # SELECT/INSERT/DELETE; UPDATE/upsert is deliberately absent.
          STORAGE_POLICY_KEY="$A_ID/policy-$RUN_ID.txt"
          echo "STORAGE_POLICY_KEY=$STORAGE_POLICY_KEY" >> .smoke/smoke.env
          anonymous_insert=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: text/plain' \
            --data-binary 'anonymous write')
          [[ ! "$anonymous_insert" =~ ^2 ]]
          owner_insert=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H 'Content-Type: text/plain' -H 'x-upsert: false' \
            --data-binary 'immutable owner object')
          [[ "$owner_insert" =~ ^2 ]]
          owner_select=$(curl -s -o .smoke/storage-owner.txt -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a")
          [[ "$owner_select" =~ ^2 ]]
          grep -Fxq 'immutable owner object' .smoke/storage-owner.txt
          cross_select=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_b")
          [[ ! "$cross_select" =~ ^2 ]]
          owner_update=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H 'Content-Type: text/plain' -H 'x-upsert: true' \
            --data-binary 'forbidden overwrite')
          [[ ! "$owner_update" =~ ^2 ]]
          anonymous_update=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: text/plain' \
            -H 'x-upsert: true' --data-binary 'anonymous overwrite')
          [[ ! "$anonymous_update" =~ ^2 ]]
          cross_update=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_b" \
            -H 'Content-Type: text/plain' -H 'x-upsert: true' \
            --data-binary 'cross-user overwrite')
          [[ ! "$cross_update" =~ ^2 ]]
          after_updates=$(curl -s -o .smoke/storage-after-updates.txt -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a")
          [[ "$after_updates" =~ ^2 ]]
          grep -Fxq 'immutable owner object' .smoke/storage-after-updates.txt
          cross_delete=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            "$SUPABASE_URL/storage/v1/object/notes-attachments" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_b" \
            -H 'Content-Type: application/json' \
            -d "{\"prefixes\":[\"$STORAGE_POLICY_KEY\"]}")
          [[ ! "$cross_delete" =~ ^5 ]]
          still_present=$(curl -s -o .smoke/storage-after-cross-delete.txt -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a")
          [[ "$still_present" =~ ^2 ]]
          grep -Fxq 'immutable owner object' .smoke/storage-after-cross-delete.txt
          # 4f. The owner can mint a short-lived signed URL, and the holder of
          # that URL downloads the exact object bytes. This is the application
          # download path: /upload signs only clean rows for its owner
          # (app/routes/upload.tsx createSignedUrl; unit-tested in
          # app/__tests__/upload.test.ts).
          signed_response=$(curl -sf -X POST \
            "$SUPABASE_URL/storage/v1/object/sign/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H 'Content-Type: application/json' -d '{"expiresIn":60}')
          signed_path=$(echo "$signed_response" | jq -er '.signedURL')
          # Storage deployments differ on whether signedURL already carries
          # the /storage/v1 prefix; normalize the way supabase-js does.
          case "$signed_path" in
            /storage/v1/*) signed_url="$SUPABASE_URL$signed_path" ;;
            /*) signed_url="$SUPABASE_URL/storage/v1$signed_path" ;;
            http*) signed_url="$signed_path" ;;
            *) echo "unexpected signedURL shape" >&2; exit 1 ;;
          esac
          signed_get=$(curl -s -o .smoke/storage-signed-download.txt -w '%{http_code}' \
            "$signed_url")
          [ "$signed_get" = "200" ]
          grep -Fxq 'immutable owner object' .smoke/storage-signed-download.txt
          record storage-owner-signed-url-download pass
          owner_delete=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            "$SUPABASE_URL/storage/v1/object/notes-attachments" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a" \
            -H 'Content-Type: application/json' \
            -d "{\"prefixes\":[\"$STORAGE_POLICY_KEY\"]}")
          [[ "$owner_delete" =~ ^2 ]]
          after_delete=$(curl -s -o /dev/null -w '%{http_code}' \
            "$SUPABASE_URL/storage/v1/object/notes-attachments/$STORAGE_POLICY_KEY" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $token_a")
          [[ ! "$after_delete" =~ ^2 ]]
          record storage-policy-select-insert-update-delete pass

          # 5. Logout clears the session: the next /notes read is denied again.
          # The action entry parses a form body unconditionally, so the POST
          # needs a form content type even with an empty body.
          code=$(curl -s -o /dev/null -w '%{http_code}' -b .smoke/jar-a -c .smoke/jar-a \
            -X POST "$BASE/notes?/logout" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            -d '')
          [ "$code" = "303" ]
          after=$(curl -s -b .smoke/jar-a "$BASE/notes")
          echo "$after" | grep -q "Sign-in is required"
          record logout-clears-session pass

      - name: Run the Chromium auth, write, Realtime, recovery, and logout journey
        run: |
          set -euo pipefail
          source .smoke/smoke.env
          curl -sf -X PUT "$SUPABASE_URL/auth/v1/admin/users/$A_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            -d '{"app_metadata":{"role":"admin"}}' > /dev/null
          SMOKE_BASE_URL=http://127.0.0.1:4173 \
          SMOKE_USER_EMAIL="$A_EMAIL" \
          SMOKE_USER_PASSWORD="$A_PASSWORD" \
          SMOKE_USER_ID="$A_ID" \
          SMOKE_OTHER_USER_ID="$B_ID" \
          SMOKE_RUN_ID="$RUN_ID" \
          SMOKE_RESULTS_FILE="$GITHUB_WORKSPACE/.smoke/results.jsonl" \
            deno run -A tools/smoke-supabase-browser.ts

      - name: Delete the throwaway test users (Auth admin API)
        # Cleanup guarantee: runs even when the matrix above fails, so the
        # real project never accumulates smoke users. The seeded note is
        # removed by the notes table's ON DELETE CASCADE.
        if: always()
        run: |
          if [ ! -f .smoke/smoke.env ]; then
            echo "no smoke users were created; nothing to clean up"
            exit 0
          fi
          source .smoke/smoke.env
          status=0
          keys=$(curl -sf \
            "$SUPABASE_URL/rest/v1/attachment_reservations?select=object_key&user_id=in.($A_ID,$B_ID)" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            | jq '[.[].object_key]' || echo '[]')
          if [ -n "${STORAGE_POLICY_KEY:-}" ]; then
            keys=$(echo "$keys" | jq --arg key "$STORAGE_POLICY_KEY" '. + [$key] | unique')
          fi
          if [ "$(echo "$keys" | jq 'length')" -gt 0 ]; then
            storage_code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              "$SUPABASE_URL/storage/v1/object/notes-attachments" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H 'Content-Type: application/json' \
              -d "$(jq -cn --argjson prefixes "$keys" '{prefixes:$prefixes}')")
            echo "DELETE smoke storage objects -> $storage_code"
            [[ "$storage_code" =~ ^2 ]] || status=1
          fi
          for id in "${A_ID:-}" "${B_ID:-}"; do
            [ -n "$id" ] || continue
            code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              "$SUPABASE_URL/auth/v1/admin/users/$id" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
            echo "DELETE admin user -> $code"
            [ "$code" = "200" ] || status=1
          done
          exit $status

      - name: Write the redacted smoke report
        if: always()
        run: |
          matrix='[]'
          if [ -f .smoke/results.jsonl ]; then
            matrix=$(jq -s '.' .smoke/results.jsonl)
          fi
          jq -n \
            --arg version "$(git rev-parse --short HEAD)" \
            --arg runId "${{ github.run_id }}" \
            --arg status "${{ job.status }}" \
            --arg migrationMode "${{ inputs.migration_mode || 'skip' }}" \
            --arg manifestSha "$(sha256sum examples/supabase-cloudflare-starter/supabase/migration-manifest.json | cut -d' ' -f1)" \
            --argjson matrix "$matrix" \
            '{
              version: $version,
              runId: $runId,
              jobStatus: $status,
              migrationMode: $migrationMode,
              migrationManifestSha256: $manifestSha,
              matrix: $matrix,
              note: "tier-2 real-project qualification; redacted — no credentials, emails, or user ids in this report"
            }' > supabase-project-smoke.json

      - name: Archive the smoke report
        if: always()
        # v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: supabase-project-smoke
          path: supabase-project-smoke.json
          if-no-files-found: error
