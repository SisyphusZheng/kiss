name: AutoFlow Publish Existing

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g., 0.41.0-alpha.1)'
        required: true
      dry_run:
        description: 'Validate the release plan without publishing, pushing, tagging, or writing evidence'
        required: false
        default: false
        type: boolean

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    name: Execute release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
      # #997: the release-tier fullstack:evidence-freshness gate reads the
      # scheduled run history of the tier-2/tier-3 smoke workflows through
      # the Actions API; GITHUB_TOKEN needs actions:read for that.
      actions: read
    steps:
      # v7.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-deno-workspace
      # v6.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Playwright browsers
        # All three engines: the release tier includes fixture:request-time:gate,
        # which runs the request-time fixture suite on Chromium, Firefox and
        # WebKit (release evidence requirement).
        run: ./node_modules/.bin/playwright install --with-deps chromium firefox webkit
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
      - name: Publish version already merged to main
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          deno task autoflow:publish-existing --to "$RELEASE_VERSION" $RELEASE_DRY_RUN
