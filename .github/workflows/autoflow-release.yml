name: AutoFlow Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g., 0.40.7)'
        required: true
      plan:
        description: 'Release plan type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      approvedPlan:
        description: 'Approved plan id (required for patch cleanup train or minor/major releases)'
        required: false

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  gates:
    name: Release gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deno-workspace
      - name: Install Playwright browsers
        run: deno run -A npm:playwright@1.59.1 install --with-deps chromium
      - name: AutoFlow3 CI gate
        run: deno task autoflow:ci

  release:
    name: Execute release
    runs-on: ubuntu-latest
    needs: [gates]
    timeout-minutes: 360
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-deno-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Patch release
        if: ${{ inputs.plan == 'patch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          deno task autoflow:patch-release --approved-plan ${{ inputs.approvedPlan || 'ADR-0105/v0.40.x-cleanup-train' }}
      - name: Approved release
        if: ${{ inputs.plan != 'patch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          deno task autoflow:release --approved-plan ${{ inputs.approvedPlan }} --to ${{ inputs.version }}

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [release]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-deno-workspace
      - name: Deploy www/dist to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: deno run -A tools/deploy-pages.ts
      - name: Deploy smoke test
        env:
          DEPLOY_SMOKE_BASE_URL: ${{ secrets.DEPLOY_SMOKE_BASE_URL || 'https://openelement.pages.dev' }}
        run: deno run -A tools/smoke-deploy.ts
