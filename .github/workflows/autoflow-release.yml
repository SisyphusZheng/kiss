name: AutoFlow Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g., 0.41.0-alpha.1)'
        required: true
      plan:
        description: 'Release plan type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      approvedPlan:
        description: 'Approved plan id (required for minor/major releases)'
        required: false

concurrency:
  group: openelement-release
  cancel-in-progress: false

jobs:
  release:
    name: Execute release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      id-token: write
    steps:
      # v4.2.2
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/setup-deno-workspace
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Install Playwright browsers
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Resolve approved plan
        id: plan
        run: echo "value=${{ inputs.approvedPlan }}" >> "$GITHUB_OUTPUT"
      - name: Configure npm auth
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
      - name: Patch release
        if: ${{ inputs.plan == 'patch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno task autoflow:patch-release --approved-plan ${{ steps.plan.outputs.value }}
      - name: Approved release
        if: ${{ inputs.plan != 'patch' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          deno task autoflow:release --approved-plan ${{ steps.plan.outputs.value }} --to ${{ inputs.version }}
